name: Build VSIX

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bundled LSP smoke test
        run: bun run test -- tests/lsp.e2e.test.ts

      - name: Run tests with coverage
        run: bun run test:coverage -- --exclude tests/lsp.e2e.test.ts

      - name: Run VS Code extension tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:vscode

      - name: Run VS Code extension tests (Windows)
        if: runner.os == 'Windows'
        run: bun run test:vscode

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true

      - name: Package VSIX
        if: runner.os == 'Linux'
        run: npx --yes @vscode/vsce package --no-dependencies --out vscode-eta-${{ github.sha }}.vsix

      - name: Upload VSIX artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: vscode-eta-vsix
          path: "*.vsix"
